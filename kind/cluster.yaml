kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: shop
nodes:
  # The control-plane also hosts the ingress controller, so it exposes host port 8080
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
  - role: worker
  - role: worker