apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
  - ingress.yaml

# Generated ConfigMap gets a content hash in its name, so changing the config
# automatically triggers a rolling update of the Deployment.
configMapGenerator:
  - name: shop-config
    namespace: shop
    literals:
      - GREETING=hello from base
      - APP_VERSION=1.0.0