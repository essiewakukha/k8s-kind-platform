apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

configMapGenerator:
  - name: shop-config
    namespace: shop
    behavior: merge
    literals:
      - GREETING=hello from prod

patches:
  # More capacity floor and ceiling in prod
  - target:
      kind: HorizontalPodAutoscaler
      name: shop-api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 8
  # Larger CPU/memory envelope in prod
  - target:
      kind: Deployment
      name: shop-api
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 100m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 400m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 256Mi
  # Keep more pods up during node drains in prod
  - target:
      kind: PodDisruptionBudget
      name: shop-api
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 2